<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCampus — Messagerie</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary:      #3b82f6;
            --secondary:    #1e293b;
            --bg:           #f1f5f9;
            --surface:      #fff;
            --surface-2:    #f8fafc;
            --border:       #e2e8f0;
            --border-strong:#cbd5e1;
            --text:         #0f172a;
            --text-muted:   #64748b;
            --text-light:   #94a3b8;
            --success:      #10b981;
            --danger:       #ef4444;
            --sidebar-w:    260px;
            --header-h:     64px;
            --footer-h:     56px;
            --radius:       12px;
            --radius-sm:    8px;
            --shadow:       0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);

            /* Role accent — default student green; overridden by JS */
            --role-accent:       #10b981;
            --role-accent-2:     #3b82f6;
            --role-accent-light: rgba(16,185,129,.1);
            --role-accent-mid:   rgba(16,185,129,.2);
            --msg-sent-bg:       #dcfce7;
            --msg-sent-border:   #bbf7d0;
            --msg-sent-color:    #064e3b;
            --bubble-accent:     #10b981;
        }

        /* Teacher override */
        body.teacher-mode {
            --role-accent:       #6366f1;
            --role-accent-2:     #8b5cf6;
            --role-accent-light: rgba(99,102,241,.1);
            --role-accent-mid:   rgba(99,102,241,.2);
            --msg-sent-bg:       #ede9fe;
            --msg-sent-border:   #ddd6fe;
            --msg-sent-color:    #3730a3;
            --bubble-accent:     #6366f1;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; line-height: 1.5; }

        /* ─── HEADER ──────────────────────────────── */
        header { position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); background: var(--surface); border-bottom: 2px solid var(--border-strong); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,.07); flex-shrink: 0; }
        .header-left, .header-right { display: flex; align-items: center; gap: 16px; }
        .menu-btn { width: 36px; height: 36px; border: none; background: var(--surface-2); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: background .15s; }
        .menu-btn:hover { background: var(--border); }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .logo-name { font-size: 17px; font-weight: 700; color: var(--text); }
        .logo-badge { font-size: 11px; font-weight: 600; background: var(--role-accent-light); border: 1px solid var(--role-accent-mid); color: var(--role-accent); padding: 2px 8px; border-radius: 20px; }
        .notif-btn { width: 36px; height: 36px; border: none; background: var(--surface-2); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; transition: background .15s; }
        .notif-btn:hover { background: var(--border); }
        .notif-dot { width: 8px; height: 8px; background: var(--danger); border-radius: 50%; border: 2px solid white; position: absolute; top: 6px; right: 6px; }
        .user-chip { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 24px; padding: 4px 12px 4px 4px; font-size: 13px; font-weight: 500; }
        .user-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: white; font-weight: 700; }

        /* ─── LAYOUT ──────────────────────────────── */
        .layout { display: flex; flex: 1; margin-top: var(--header-h); margin-bottom: var(--footer-h); overflow: hidden; }

        /* ─── SIDEBAR ─────────────────────────────── */
        .sidebar { position: fixed; top: var(--header-h); left: 0; bottom: var(--footer-h); width: var(--sidebar-w); background: var(--secondary); overflow-y: auto; transition: transform .3s ease; z-index: 50; }
        .sidebar.collapsed { transform: translateX(-100%); }
        .sidebar-section { padding: 20px 16px 8px; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #475569; }
        .sidebar a { display: flex; align-items: center; gap: 10px; padding: 10px 16px; color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 500; border-radius: 8px; margin: 2px 8px; transition: all .15s; }
        .sidebar a:hover { background: rgba(255,255,255,.06); color: white; }
        .sidebar a.active.student-active { background: rgba(16,185,129,.15); color: #34d399; }
        .sidebar a.active.teacher-active { background: rgba(99,102,241,.15); color: #a5b4fc; }
        .nav-icon { font-size: 16px; width: 20px; text-align: center; }
        .sidebar-divider { height: 1px; background: rgba(255,255,255,.06); margin: 12px 16px; }
        .sidebar a.danger { color: #f87171; }
        .sidebar a.danger:hover { background: rgba(239,68,68,.1); color: #ef4444; }

        /* ─── CONTENT ─────────────────────────────── */
        .content { flex: 1; margin-left: var(--sidebar-w); display: flex; background: var(--surface); overflow: hidden; transition: margin-left .3s; }
        .sidebar.collapsed ~ .content { margin-left: 0; }

        /* ─── CONTACTS PANE ───────────────────────── */
        .contacts-pane { width: 300px; border-right: 2px solid var(--border-strong); display: flex; flex-direction: column; background: var(--surface-2); flex-shrink: 0; }

        .contacts-header { padding: 18px 20px 14px; border-bottom: 2px solid var(--border-strong); background: var(--surface); }
        .contacts-header-title { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .contacts-header-title h2 { font-size: 16px; font-weight: 700; color: var(--text); }
        .contacts-count { font-size: 11px; font-weight: 700; background: var(--role-accent-light); color: var(--role-accent); border: 1px solid var(--role-accent-mid); padding: 2px 8px; border-radius: 20px; margin-left: auto; }

        .search-bar { width: 100%; padding: 9px 14px; border: 1.5px solid var(--border-strong); border-radius: var(--radius-sm); outline: none; font-size: 13px; font-family: inherit; background: var(--surface); color: var(--text); transition: border-color .2s; }
        .search-bar:focus { border-color: var(--role-accent); box-shadow: 0 0 0 3px var(--role-accent-light); }
        .search-bar::placeholder { color: var(--text-light); }

        .contacts-list { flex: 1; overflow-y: auto; list-style: none; padding: 8px 0; margin: 0; }
        .contacts-list::-webkit-scrollbar { width: 4px; }
        .contacts-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

        .contact-item { display: flex; align-items: center; gap: 12px; padding: 11px 16px; cursor: pointer; border-radius: 0; transition: background .15s; position: relative; }
        .contact-item:hover { background: rgba(0,0,0,.04); }
        .contact-item.active { background: var(--role-accent-light); border-left: 3px solid var(--role-accent); }
        .contact-item.active .contact-name { color: var(--role-accent); }

        .contact-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--role-accent), var(--role-accent-2)); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; font-size: 13px; }
        .contact-info { flex: 1; min-width: 0; }
        .contact-name { font-weight: 600; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .contact-preview { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
        .unread-badge { background: var(--danger); color: white; border-radius: 50%; min-width: 20px; height: 20px; padding: 0 5px; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        /* ─── CHAT PANE ───────────────────────────── */
        .chat-pane { flex: 1; display: flex; flex-direction: column; background: var(--surface); }

        .chat-header { padding: 14px 20px; border-bottom: 2px solid var(--border-strong); display: flex; align-items: center; gap: 12px; background: var(--surface); }
        .chat-header-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--role-accent), var(--role-accent-2)); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
        .chat-header-info h3 { font-size: 15px; font-weight: 700; color: var(--text); }
        .chat-header-info .chat-name { font-size: 15px; font-weight: 700; color: var(--text); }

        /* Chat messages area */
        .chat-history { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: var(--bg); }
        .chat-history::-webkit-scrollbar { width: 4px; }
        .chat-history::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

        .empty-chat { margin: auto; color: var(--text-muted); text-align: center; }
        .empty-chat-icon { font-size: 48px; margin-bottom: 12px; }
        .empty-chat h3 { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
        .empty-chat p { font-size: 13px; }

        /* Bubbles */
        .message { max-width: 68%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; position: relative; }
        .msg-received { background: var(--surface); border: 1.5px solid var(--border-strong); border-bottom-left-radius: 4px; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.05); align-self: flex-start; }
        .msg-sent { background: var(--msg-sent-bg); border: 1.5px solid var(--msg-sent-border); border-bottom-right-radius: 4px; color: var(--msg-sent-color); align-self: flex-end; }
        .msg-time { font-size: 10px; color: var(--text-light); margin-top: 4px; padding: 0 4px; }
        .msg-sent .msg-time { text-align: right; }
        .msg-status { font-size: 10px; color: var(--role-accent); text-align: right; margin-top: 2px; font-weight: 600; padding: 0 4px; }

        /* Date separator */
        .date-separator { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
        .date-separator::before, .date-separator::after { content: ''; flex: 1; height: 1px; background: var(--border-strong); }
        .date-separator span { font-size: 11px; font-weight: 600; color: var(--text-muted); white-space: nowrap; padding: 2px 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; }

        /* ─── INPUT AREA ──────────────────────────── */
        .chat-input-area { padding: 14px 16px; border-top: 2px solid var(--border-strong); display: flex; gap: 10px; align-items: flex-end; background: var(--surface); }
        .chat-input-wrapper { flex: 1; border: 1.5px solid var(--border-strong); border-radius: 12px; background: var(--surface-2); transition: border-color .2s, box-shadow .2s; display: flex; align-items: flex-end; gap: 8px; padding: 10px 14px; }
        .chat-input-wrapper:focus-within { border-color: var(--role-accent); box-shadow: 0 0 0 3px var(--role-accent-light); }
        .chat-input { flex: 1; border: none; background: transparent; resize: none; font-family: inherit; outline: none; font-size: 14px; color: var(--text); max-height: 120px; line-height: 1.5; }
        .chat-input::placeholder { color: var(--text-light); }
        .char-count { font-size: 11px; color: var(--text-light); white-space: nowrap; align-self: flex-end; padding-bottom: 1px; }

        .btn-send { background: linear-gradient(135deg, var(--role-accent), var(--role-accent-2)); color: white; border: none; width: 44px; height: 44px; border-radius: 12px; font-size: 18px; cursor: pointer; transition: .2s; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .btn-send:hover { transform: scale(1.05); box-shadow: 0 4px 12px var(--role-accent-mid); }
        .btn-send:disabled { background: var(--border); cursor: not-allowed; transform: none; box-shadow: none; }

        /* Empty / loading states */
        .state-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; background: var(--bg); color: var(--text-muted); text-align: center; padding: 40px; }
        .state-panel-icon { font-size: 52px; margin-bottom: 16px; }
        .state-panel h2 { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
        .state-panel p { font-size: 14px; max-width: 280px; }
        .accent-text { color: var(--role-accent); }

        /* ─── FOOTER ──────────────────────────────── */
        footer { position: fixed; bottom: 0; left: 0; right: 0; height: var(--footer-h); background: var(--surface); border-top: 2px solid var(--border-strong); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 13px; color: var(--text-muted); z-index: 100; }
    </style>
<script src="notifications.js"></script>
</head>
<body>

<header>
    <div class="header-left">
        <button class="menu-btn" id="menuToggle">☰</button>
        <a href="#" class="logo" id="homeLogoLink">
            <div class="logo-icon" id="logoIcon">🎓</div>
            <span class="logo-name">SmartCampus</span>
        </a>
        <span class="logo-badge" id="roleBadge">Espace</span>
    </div>
    <div class="header-right">
        <button class="notif-btn">🔔<span class="notif-dot"></span></button>
        <div class="user-chip">
            <div class="user-avatar" id="userInitials">U</div>
            <span id="userNameDisplay">Utilisateur</span>
        </div>
    </div>
</header>

<div class="layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">Navigation</div>
        <div id="sidebarLinks"></div>
        <div class="sidebar-divider"></div>
        <a href="#" id="logoutBtn" class="danger"><span class="nav-icon">🚪</span> Déconnexion</a>
    </aside>

    <main class="content">

        <!-- Contacts pane -->
        <div class="contacts-pane">
            <div class="contacts-header">
                <div class="contacts-header-title">
                    <h2>💬 Conversations</h2>
                    <span class="contacts-count" id="contactsCount">0</span>
                </div>
                <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Rechercher…">
            </div>
            <ul class="contacts-list" id="contactsList">
                <div style="padding:20px;color:var(--text-muted);text-align:center;font-size:13px;">Chargement…</div>
            </ul>
        </div>

        <!-- Chat pane (active conversation) -->
        <div class="chat-pane" id="chatPane" style="display:none">
            <div class="chat-header">
                <div class="chat-header-avatar" id="currentChatAvatar"></div>
                <div class="chat-header-info">
                    <h3 id="currentChatName">—</h3>
                </div>
            </div>
            <div class="chat-history" id="chatHistory"></div>
            <form class="chat-input-area" id="chatForm">
                <div class="chat-input-wrapper">
                    <textarea class="chat-input" id="messageInput" rows="1" placeholder="Écrire un message… (Entrée pour envoyer)" maxlength="1000"></textarea>
                    <span class="char-count" id="charCount">0/1000</span>
                </div>
                <button type="submit" class="btn-send" id="sendBtn" title="Envoyer">➤</button>
            </form>
        </div>

        <!-- Empty state -->
        <div class="state-panel" id="emptyPane">
            <div class="state-panel-icon">💬</div>
            <h2>Vos discussions</h2>
            <p>Sélectionnez un contact dans la liste pour démarrer ou reprendre une conversation.</p>
        </div>

    </main>
</div>

<footer>
    <div>📧 support@smartcampus.edu</div>
    <div>📞 +33 06 12 34 56 78</div>
</footer>

<script>
    const user = JSON.parse(localStorage.getItem('smartcampus_user'));
    if (!user) window.location.href = "http://localhost:8888/Smart_Campus/Code/Connexion/index.html";

    const isTeacher = user.role === 'enseignant';
    if (isTeacher) document.body.classList.add('teacher-mode');

    document.getElementById('userNameDisplay').textContent = user.prenom + ' ' + user.nom + (isTeacher ? ' (Prof)' : '');
    document.getElementById('userInitials').textContent = (user.prenom[0] + user.nom[0]).toUpperCase();

    SmartNotifs.init(user);

    const logoIcon   = document.getElementById('logoIcon');
    const userAvatar = document.getElementById('userInitials');

    if (isTeacher) {
        logoIcon.style.background = 'linear-gradient(135deg, #6366f1, #8b5cf6)';
        userAvatar.style.background = 'linear-gradient(135deg, #8b5cf6, #6366f1)';
        document.getElementById('roleBadge').textContent = 'Espace Enseignant';
        document.getElementById('homeLogoLink').href = 'teacher_dashboard.html';
        document.getElementById('sidebarLinks').innerHTML = `
            <a href="teacher_dashboard.html"><span class="nav-icon">🏠</span> Accueil</a>
            <a href="teacher_courses.html"><span class="nav-icon">📚</span> Mes Cours</a>
            <a href="teacher_grades.html"><span class="nav-icon">📝</span> Saisie des Notes</a>
            <a href="timetable.html"><span class="nav-icon">📅</span> Emploi du temps</a>
            <a href="messages.html" class="active teacher-active"><span class="nav-icon">✉️</span> Messagerie</a>`;
    } else {
        logoIcon.style.background = 'linear-gradient(135deg, #3b82f6, #10b981)';
        userAvatar.style.background = 'linear-gradient(135deg, #10b981, #3b82f6)';
        document.getElementById('roleBadge').textContent = 'Espace Étudiant';
        document.getElementById('homeLogoLink').href = 'dashboard.html';
        document.getElementById('sidebarLinks').innerHTML = `
            <a href="dashboard.html"><span class="nav-icon">🏠</span> Accueil</a>
            <a href="student_courses.html"><span class="nav-icon">📚</span> Mes Cours</a>
            <a href="student_grades.html"><span class="nav-icon">📊</span> Mes Notes</a>
            <a href="timetable.html"><span class="nav-icon">📅</span> Emploi du temps</a>
            <a href="messages.html" class="active student-active"><span class="nav-icon">✉️</span> Messagerie</a>`;
    }

    document.getElementById('menuToggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('collapsed'));
    document.getElementById('logoutBtn').addEventListener('click', () => { localStorage.clear(); window.location.href = "http://localhost:8888/Smart_Campus/Code/Connexion/index.html"; });

    let contactsCache = [];
    let currentContactId = null;

    /* ─── CONTACTS ─────────────────────────────────── */
    function loadContacts() {
        fetch(`http://localhost:8888/Smart_Campus/Code/Prof_et_eleve/php/chat_api.php?action=get_contacts&id_user=${user.id_user}&role=${user.role}`)
        .then(res => res.json())
        .then(data => {
            if (data.success) { contactsCache = data.data; renderContacts(contactsCache); }
        });
    }

    function renderContacts(arr) {
        const list = document.getElementById('contactsList');
        document.getElementById('contactsCount').textContent = arr.length;
        list.innerHTML = '';
        if (!arr.length) {
            list.innerHTML = `<div style="padding:24px;color:var(--text-muted);text-align:center;font-size:13px;">Aucun contact trouvé.</div>`;
            return;
        }
        arr.forEach(c => {
            const li = document.createElement('li');
            li.className = `contact-item ${currentContactId === c.id_user ? 'active' : ''}`;
            const initials = (c.prenom.charAt(0) + c.nom.charAt(0)).toUpperCase();
            const unread   = parseInt(c.unread_count) > 0;
            const badge    = unread ? `<div class="unread-badge">${c.unread_count}</div>` : '';
            li.innerHTML = `
                <div class="contact-avatar">${initials}</div>
                <div class="contact-info">
                    <div class="contact-name" style="${unread?'font-weight:700':''}">${c.prenom} ${c.nom}</div>
                    <div class="contact-preview">${unread?'Nouveau message':'Cliquer pour discuter'}</div>
                </div>
                ${badge}`;
            li.onclick = () => openChat(c.id_user, `${c.prenom} ${c.nom}`, initials);
            list.appendChild(li);
        });
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
        const term = e.target.value.toLowerCase();
        renderContacts(contactsCache.filter(c => c.nom.toLowerCase().includes(term) || c.prenom.toLowerCase().includes(term)));
    });

    /* ─── OPEN CHAT ─────────────────────────────────── */
    function openChat(targetId, targetName, targetInitials) {
        currentContactId = targetId;
        document.getElementById('emptyPane').style.display  = 'none';
        document.getElementById('chatPane').style.display   = 'flex';
        document.getElementById('currentChatName').textContent    = targetName;
        document.getElementById('currentChatAvatar').textContent  = targetInitials;
        loadContacts();
        loadMessages(true);
    }

    /* ─── MESSAGES ──────────────────────────────────── */
    function formatTime(dateString) {
        const d = new Date(dateString);
        return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    }

    function formatDate(dateString) {
        const d = new Date(dateString);
        const today = new Date();
        const yesterday = new Date(today); yesterday.setDate(today.getDate()-1);
        if (d.toDateString() === today.toDateString()) return "Aujourd'hui";
        if (d.toDateString() === yesterday.toDateString()) return 'Hier';
        return d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
    }

    function loadMessages(forceScroll = false) {
        if (!currentContactId) return;
        const history = document.getElementById('chatHistory');
        fetch(`http://localhost:8888/Smart_Campus/Code/Prof_et_eleve/php/chat_api.php?action=get_messages&me=${user.id_user}&other=${currentContactId}`)
        .then(res => res.json())
        .then(data => {
            const isAtBottom = history.scrollHeight - history.scrollTop <= history.clientHeight + 60;
            history.innerHTML = '';
            if (!data.success || !data.data.length) {
                history.innerHTML = `<div class="empty-chat"><div class="empty-chat-icon">👋</div><h3>Démarrez la conversation</h3><p>Dites bonjour !</p></div>`;
                return;
            }

            let lastDate = null;
            data.data.forEach(msg => {
                const isMe    = parseInt(msg.id_expediteur) === parseInt(user.id_user);
                const msgDate = formatDate(msg.date_envoi);

                // Date separator
                if (msgDate !== lastDate) {
                    lastDate = msgDate;
                    const sep = document.createElement('div');
                    sep.className = 'date-separator';
                    sep.innerHTML = `<span>${msgDate}</span>`;
                    history.appendChild(sep);
                }

                const div = document.createElement('div');
                div.className = `message ${isMe ? 'msg-sent' : 'msg-received'}`;
                let readReceipt = '';
                if (isMe) {
                    if (msg.date_lecture) {
                        readReceipt = `<div class="msg-status">✓✓ Lu à ${formatTime(msg.date_lecture)}</div>`;
                    } else {
                        readReceipt = `<div class="msg-status" style="color:var(--text-light);font-weight:500">✓ Envoyé</div>`;
                    }
                }
                div.innerHTML = `<div>${msg.contenu.replace(/\n/g,'<br>')}</div><div class="msg-time">${formatTime(msg.date_envoi)}</div>${readReceipt}`;
                history.appendChild(div);
            });

            if (forceScroll || isAtBottom) history.scrollTop = history.scrollHeight;
        });
    }

    /* ─── SEND ──────────────────────────────────────── */
    function sendMessage() {
        const input   = document.getElementById('messageInput');
        const contenu = input.value.trim();
        if (!contenu || !currentContactId) return;
        document.getElementById('sendBtn').disabled = true;
        fetch('http://localhost:8888/Smart_Campus/Code/Prof_et_eleve/php/chat_api.php', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ me: user.id_user, other: currentContactId, contenu })
        }).then(res=>res.json()).then(data => {
            document.getElementById('sendBtn').disabled = false;
            if (data.success) { input.value=''; updateCharCount(); loadMessages(true); loadContacts(); }
        }).catch(() => { document.getElementById('sendBtn').disabled = false; });
    }

    document.getElementById('chatForm').addEventListener('submit', function(e) {
        e.preventDefault();
        sendMessage();
    });

    /* Enter to send, Shift+Enter for newline */
    document.getElementById('messageInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    /* Char counter & auto-resize */
    function updateCharCount() {
        const input = document.getElementById('messageInput');
        document.getElementById('charCount').textContent = input.value.length + '/1000';
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    }
    document.getElementById('messageInput').addEventListener('input', updateCharCount);

    /* ─── POLL ──────────────────────────────────────── */
    setInterval(() => { loadContacts(); if (currentContactId) loadMessages(false); }, 3000);
    loadContacts();
</script>
</body>
</html>
