<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartCampus — Espace Enseignant</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root{
            --primary:#3b82f6;
            --primary-dark:#1d4ed8;
            --secondary:#1e293b;
            --bg:#f1f5f9;
            --surface:#fff;
            --surface-2:#f8fafc;
            --border:#e2e8f0;
            --text:#0f172a;
            --text-muted:#64748b;
            --text-light:#94a3b8;
            --success:#10b981;
            --warning:#f59e0b;
            --danger:#ef4444;
            --sidebar-w:260px;
            --header-h:64px;
            --footer-h:56px;
            --radius:12px;
            --radius-sm:8px;
            --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
            --shadow-md:0 4px 20px rgba(0,0,0,.1);
        }

        *{box-sizing:border-box;margin:0;padding:0}

        body{
            font-family:'DM Sans',sans-serif;
            background:var(--bg);
            color:var(--text);
            display:flex;
            flex-direction:column;
            min-height:100vh;
            line-height:1.5;
        }

        header{
            position:fixed;
            top:0;left:0;right:0;
            height:var(--header-h);
            background:var(--surface);
            border-bottom:1px solid var(--border);
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 24px;
            z-index:100;
            box-shadow:0 1px 0 var(--border),0 4px 20px rgba(0,0,0,.04);
        }

        .header-left,.header-right{display:flex;align-items:center;gap:16px}

        .menu-btn{
            width:36px;height:36px;
            border:none;
            background:var(--surface-2);
            border-radius:8px;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:18px;
        }
        .menu-btn:hover{background:var(--border)}

        .logo{display:flex;align-items:center;gap:10px;text-decoration:none}
        .logo-icon{
            width:34px;height:34px;
            background:linear-gradient(135deg,#3b82f6,#8b5cf6);
            border-radius:9px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:18px;
        }

        .logo-name{font-size:17px;font-weight:700;color:var(--text)}

        .logo-badge{
            font-size:11px;
            font-weight:600;
            background:var(--surface-2);
            border:1px solid var(--border);
            color:var(--text-muted);
            padding:2px 8px;
            border-radius:20px;
        }

        .notif-btn{
            width:36px;height:36px;
            border:none;
            background:var(--surface-2);
            border-radius:8px;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            position:relative;
        }
        .notif-btn:hover{background:var(--border)}

        .notif-dot{
            width:8px;height:8px;
            background:var(--danger);
            border-radius:50%;
            border:2px solid #fff;
            position:absolute;
            top:6px;right:6px;
        }

        .user-chip{
            display:flex;
            align-items:center;
            gap:8px;
            background:var(--surface-2);
            border:1px solid var(--border);
            border-radius:24px;
            padding:4px 12px 4px 4px;
            font-size:13px;
            font-weight:500;
        }

        .user-avatar{
            width:28px;height:28px;
            background:linear-gradient(135deg,#8b5cf6,#3b82f6);
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:12px;
            color:#fff;
            font-weight:700;
        }

        .main-wrapper{
            display:flex;
            flex:1;
            margin-top:var(--header-h);
            margin-bottom:var(--footer-h);
        }

        .sidebar{
            position:fixed;
            top:var(--header-h);
            left:0;
            bottom:var(--footer-h);
            width:var(--sidebar-w);
            background:var(--secondary);
            overflow-y:auto;
            transition:.3s;
        }
        .sidebar.collapsed{transform:translateX(-100%)}

        .sidebar-section{
            padding:20px 16px 8px;
            font-size:10px;
            font-weight:700;
            letter-spacing:1.2px;
            text-transform:uppercase;
            color:#475569;
        }

        .sidebar a{
            display:flex;
            align-items:center;
            gap:10px;
            padding:10px 16px;
            margin:2px 8px;
            border-radius:8px;
            color:#94a3b8;
            text-decoration:none;
            font-size:14px;
        }
        .sidebar a:hover{background:rgba(255,255,255,.06);color:#fff}
        .sidebar a.active{background:rgba(59,130,246,.15);color:#60a5fa}

        .nav-icon{font-size:16px;width:20px;text-align:center}

        .sidebar-divider{
            height:1px;
            background:rgba(255,255,255,.06);
            margin:12px 16px;
        }

        .sidebar a.danger{color:#f87171}
        .sidebar a.danger:hover{background:rgba(239,68,68,.1);color:#ef4444}

        .content{
            flex:1;
            margin-left:var(--sidebar-w);
            padding:28px;
            transition:.3s;
        }
        .sidebar.collapsed ~ .content{margin-left:0}

        .courses-grid{
	        display:grid;
	        grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
	        gap:20px;
        }

        .course-card{
	        background:var(--surface);
	        border-radius:var(--radius);
	        overflow:hidden;
	        box-shadow:var(--shadow);
	        display:flex;
	        flex-direction:column;
	        transition:.2s;
	        border:1px solid var(--border);
        }

        .course-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}

        .course-title{
	        background:var(--secondary);
	        color:#fff;
	        padding:16px 20px;
	        font-size:15px;
	        font-weight:700;
        }

        .course-info-block{
	        padding:18px;
	        flex:1;
	        color:var(--text-muted);
	        font-size:14px;
	        line-height:1.7;
	        background:var(--surface);
        }

        .course-actions{
	        display:flex;
	        flex-direction:column;
	        gap:10px;
	        padding:16px;
	        border-top:1px solid var(--border);
	        background:var(--surface-2);
        }

        .btn-action{
	        padding:10px 14px;
	        border:1px solid var(--border);
	        border-radius:var(--radius-sm);
	        background:var(--surface);
	        color:var(--text);
	        font-weight:600;
	        cursor:pointer;
	        transition:.2s;
	        text-align:center;
        }

        .btn-action:hover{
	        background:var(--primary);
	        color:#fff;
	        border-color:var(--primary);
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <button class="menu-btn" id="menuToggle">☰</button>

        <a href="#" class="logo">
            <div class="logo-icon">🎓</div>
            <span class="logo-name">SmartCampus</span>
        </a>

        <span class="logo-badge">Espace Enseignant</span>
    </div>

    <div class="header-right">
        <button class="notif-btn">🔔<span class="notif-dot"></span></button>

        <div class="user-chip">
            <div class="user-avatar" id="userInitials">P</div>
            <span id="userNameDisplay">Enseignant</span>
        </div>
    </div>
</header>

<div class="main-wrapper">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">Navigation</div>

        <a href="http://localhost:8888/Smart_Campus/Code/Prof_et_eleve/html/dashboard.html">
            <span class="nav-icon">🏠</span> Accueil
        </a>

        <a href="http://localhost:8888/Smart_Campus/Code/Prof_et_eleve/html/teacher_courses.html" class="active">
            <span class="nav-icon">📚</span> Mes Cours
        </a>

        <a href="#">
            <span class="nav-icon">📝</span> Saisie des Notes
        </a>

        <a href="http://localhost:8888/Smart_Campus/Code/Prof_et_eleve/html/timetable.html">
            <span class="nav-icon">📅</span> Emploi du temps
        </a>

        <a href="#">
            <span class="nav-icon">✉️</span> Messagerie
        </a>

        <div class="sidebar-divider"></div>

        <a href="#" id="logoutBtn" class="danger">
            <span class="nav-icon">🚪</span> Déconnexion
        </a>
    </aside>

    <main class="content">

        <div class="page-header">
            <h2>Mes Cours Assignés</h2>
        </div>

        <div class="courses-grid" id="coursesContainer">
            <div class="empty-message">Chargement de vos cours...</div>
        </div>

    </main>

</div>

<footer>
    <div>📧 support@smartcampus.edu</div>
    <div>📞 +33 06 12 34 56 78</div>
</footer>

<script>
let currentUser=null;

/* ═══ AUTH ═══════════════════════════════════════════ */
const userStr=localStorage.getItem('smartcampus_user');

if(!userStr){
    window.location.href="http://localhost:8888/Smart_Campus/Code/Connexion/index.html";
}else{
    currentUser=JSON.parse(userStr);

    if(currentUser.role!=="enseignant"){
        alert("Accès réservé aux enseignants.");
        window.location.href="http://localhost:8888/Smart_Campus/Code/Connexion/index.html";
    }

    document.getElementById('userNameDisplay').textContent=
        `${currentUser.prenom} ${currentUser.nom} (Prof)`;

    document.getElementById('userInitials').textContent=
        (currentUser.prenom[0]+currentUser.nom[0]).toUpperCase();
}

/* ═══ UI EVENTS ═══════════════════════════════════════ */
document.getElementById('menuToggle').addEventListener('click',()=>{
    document.getElementById('sidebar').classList.toggle('collapsed');
});

document.getElementById('logoutBtn').addEventListener('click',()=>{
    localStorage.removeItem('smartcampus_user');
    window.location.href="http://localhost:8888/Smart_Campus/Code/Connexion/index.html";
});

/* ═══ MODAL HELPERS ═══════════════════════════════════ */
function openModal(id){
    document.getElementById(id).style.display="flex";
}

function closeModal(id){
    document.getElementById(id).style.display="none";
}

/* ═══ LOAD COURSES ════════════════════════════════════ */
function loadTeacherCourses(){

    fetch(`http://localhost:8888/Smart_Campus/Code/Prof_et_eleve/php/get_teacher_courses.php?id_user=${currentUser.id_user}`)
    .then(res=>res.json())
    .then(data=>{

        const container=document.getElementById('coursesContainer');
        container.innerHTML="";

        if(!data.success){
            container.innerHTML=`<div class="empty-message" style="color:red">${data.message}</div>`;
            return;
        }

        if(data.courses.length===0){
            container.innerHTML=`<div class="empty-message">Aucun cours assigné.</div>`;
            return;
        }

        data.courses.forEach(c=>{

            const card=document.createElement('div');
            card.className="course-card";

            card.innerHTML=`
                <div class="course-title">${c.code_cours} - ${c.titre}</div>

                <div class="course-info-block">
                    <p>📅 Semestre : ${c.semestre} | Niveau : ${c.niveau}</p>
                    <p>📊 ECTS : ${c.credits} | Coeff : <strong>${c.coefficient}</strong></p>
                    <p>👥 Capacité : ${c.capacite_max}</p>
                </div>

                <div class="course-actions">

                    <button class="btn-action"
                        onclick="window.location.href='http://localhost:8888/Smart_Campus/Code/Prof_et_eleve/html/course_documents_teacher.html?id_cours=${c.id_cours}&titre=${encodeURIComponent(c.titre)}'">
                        📁 Documents
                    </button>

                    <button class="btn-action"
                        onclick="triggerViewStudents(${c.id_cours})">
                        👀 Élèves
                    </button>

                    <button class="btn-action"
                        style="background:#8b5cf6;color:white;border-color:#8b5cf6"
                        onclick="window.location.href='http://localhost:8888/Smart_Campus/Code/Prof_et_eleve/html/teacher_grades.html?id_cours=${c.id_cours}&titre=${encodeURIComponent(c.titre)}&coeff=${c.coefficient}'">
                        📝 Notes
                    </button>

                </div>
            `;

            container.appendChild(card);
        });

    })
    .catch(err=>{
        document.getElementById('coursesContainer').innerHTML=
            `<div class="empty-message" style="color:red">Erreur serveur</div>`;
        console.error(err);
    });
}

/* ═══ VIEW STUDENTS MODAL ═════════════════════════════ */
function triggerViewStudents(courseId){

    openModal('viewStudentsModal');

    const list=document.getElementById('enrolledStudentsListContainer');
    const count=document.getElementById('enrolledCount');

    list.innerHTML="Chargement...";
    count.textContent="";

    fetch(`http://localhost:8888/Smart_Campus/Code/admin/php/get_course_students.php?id_cours=${courseId}`)
    .then(res=>res.json())
    .then(data=>{

        list.innerHTML="";

        if(!data.success){
            list.innerHTML="Erreur de chargement";
            return;
        }

        if(data.data.length===0){
            list.innerHTML="Aucun élève inscrit.";
            return;
        }

        count.textContent=`${data.data.length} élève(s)`;

        data.data.forEach(s=>{

            const li=document.createElement('li');

            li.innerHTML=`
                <div>
                    <strong>${s.nom}</strong> ${s.prenom}<br>
                    <small style="color:#94a3b8">Matricule: ${s.matricule}</small>
                </div>
            `;

            list.appendChild(li);
        });
    });
}

/* ═══ INIT ═════════════════════════════════════════════ */
loadTeacherCourses();
</script>

</body>
</html>
