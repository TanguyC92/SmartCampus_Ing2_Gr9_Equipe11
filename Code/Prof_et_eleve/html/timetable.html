<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCampus — Emploi du temps</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #1e293b;
            --bg: #f1f5f9;
            --surface: #fff;
            --surface-2: #f8fafc;
            --border: #e2e8f0;
            --border-strong: #cbd5e1;
            --text: #0f172a;
            --text-muted: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --sidebar-w: 260px;
            --header-h: 64px;
            --footer-h: 56px;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);

            /* Role-based accent (defaults to student green) */
            --accent: #10b981;
            --accent-2: #3b82f6;
            --course-bg: #e0f7ef;
            --course-border: #10b981;
            --course-title: #065f46;
            --course-time: #047857;
            --course-meta: #374151;
        }

        /* Teacher theme overrides */
        body.teacher-mode {
            --accent: #6366f1;
            --accent-2: #8b5cf6;
            --course-bg: #ede9fe;
            --course-border: #6366f1;
            --course-title: #3730a3;
            --course-time: #4338ca;
            --course-meta: #374151;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; line-height: 1.5; }

        /* ─── HEADER ──────────────────────────────── */
        header { position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); background: var(--surface); border-bottom: 2px solid var(--border-strong); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,.07); flex-shrink: 0; }
        .header-left, .header-right { display: flex; align-items: center; gap: 16px; }
        .menu-btn { width: 36px; height: 36px; border: none; background: var(--surface-2); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .menu-btn:hover { background: var(--border); }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .logo-name { font-size: 17px; font-weight: 700; color: var(--text); }
        .logo-badge { font-size: 11px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text-muted); padding: 2px 8px; border-radius: 20px; }
        .notif-btn { width: 36px; height: 36px; border: none; background: var(--surface-2); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; }
        .notif-btn:hover { background: var(--border); }
        .notif-dot { width: 8px; height: 8px; background: var(--danger); border-radius: 50%; border: 2px solid white; position: absolute; top: 6px; right: 6px; }
        .user-chip { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 24px; padding: 4px 12px 4px 4px; font-size: 13px; font-weight: 500; }
        .user-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: white; font-weight: 700; }

        /* ─── LAYOUT ──────────────────────────────── */
        .layout { display: flex; flex: 1; margin-top: var(--header-h); margin-bottom: var(--footer-h); overflow: hidden; }

        /* ─── SIDEBAR ─────────────────────────────── */
        .sidebar { position: fixed; top: var(--header-h); left: 0; bottom: var(--footer-h); width: var(--sidebar-w); background: var(--secondary); overflow-y: auto; transition: transform .3s ease; z-index: 50; }
        .sidebar.collapsed { transform: translateX(-100%); }
        .sidebar-section { padding: 20px 16px 8px; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #475569; }
        .sidebar a { display: flex; align-items: center; gap: 10px; padding: 10px 16px; color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 500; border-radius: 8px; margin: 2px 8px; transition: all .15s; }
        .sidebar a:hover { background: rgba(255,255,255,.06); color: white; }
        .sidebar a.active.student-active { background: rgba(16,185,129,.15); color: #34d399; }
        .sidebar a.active.teacher-active { background: rgba(99,102,241,.15); color: #a5b4fc; }
        .nav-icon { font-size: 16px; width: 20px; text-align: center; }
        .sidebar-divider { height: 1px; background: rgba(255,255,255,.06); margin: 12px 16px; }
        .sidebar a.danger { color: #f87171; }
        .sidebar a.danger:hover { background: rgba(239,68,68,.1); color: #ef4444; }

        /* ─── CONTENT ─────────────────────────────── */
        .content { flex: 1; margin-left: var(--sidebar-w); padding: 20px; display: flex; flex-direction: column; overflow: hidden; transition: margin-left .3s; }
        .sidebar.collapsed ~ .content { margin-left: 0; }

        /* ─── CALENDAR HEADER ─────────────────────── */
        .cal-header { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 14px 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; border: 2px solid var(--border-strong); }
        .cal-header button { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 13px; transition: opacity .15s; }
        .cal-header button:hover { opacity: .85; }
        .cal-header h3 { margin: 0; color: var(--text); font-size: 16px; font-weight: 600; text-align: center; }

        /* ─── CALENDAR GRID ───────────────────────── */
        .calendar-wrapper {
            display: flex;
            flex: 1;
            background: var(--surface);
            border: 2px solid var(--border-strong);
            border-radius: var(--radius);
            overflow-y: auto;
            box-shadow: var(--shadow);
        }

        /* Time column */
        .time-column { width: 64px; flex-shrink: 0; border-right: 2px solid var(--border-strong); background: var(--surface-2); padding-top: 44px; }
        .time-label { height: 60px; text-align: right; padding-right: 10px; font-size: 11px; color: var(--text-muted); font-weight: 700; position: relative; letter-spacing: .3px; }
        .time-label span { position: absolute; top: -8px; right: 10px; }

        /* Days */
        .days-container { display: flex; flex: 1; }
        .day-column { flex: 1; border-right: 2px solid var(--border-strong); position: relative; min-width: 120px; }
        .day-column:last-child { border-right: none; }

        .day-header {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-2);
            font-weight: 700;
            font-size: 13px;
            letter-spacing: .4px;
            text-transform: uppercase;
            border-bottom: 2px solid var(--border-strong);
            position: sticky;
            top: 0;
            z-index: 10;
            color: var(--text);
        }
        .day-header.today {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: white;
        }

        /* Grid lines */
        .grid-lines { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; z-index: 1; pointer-events: none; }
        .grid-line { height: 60px; border-top: 1.5px solid var(--border-strong); box-sizing: border-box; }
        .grid-line:nth-child(even) { background: rgba(0,0,0,.012); }

        /* Courses container */
        .courses-container { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; z-index: 5; }

        /* ─── COURSE BLOCK ────────────────────────── */
        .course-block {
            position: absolute;
            left: 4px;
            right: 4px;
            background: var(--course-bg);
            border-left: 4px solid var(--course-border);
            border-radius: 7px;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,.09);
            display: flex;
            flex-direction: column;
            transition: box-shadow .2s, transform .15s;
            cursor: pointer;
        }
        .course-block:hover {
            z-index: 20;
            box-shadow: 0 6px 20px rgba(0,0,0,.18);
            transform: translateY(-1px) scaleX(1.01);
        }

        /* Inner content wrapper — clips overflow cleanly */
        .course-inner {
            flex: 1;
            overflow: hidden;
            padding: 5px 6px 4px;
            display: flex;
            flex-direction: column;
            gap: 1px;
            min-height: 0;
        }

        /* Title row — always visible, ellipsis if needed */
        .c-title {
            font-weight: 700;
            color: var(--course-title);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
            flex-shrink: 0;
        }

        /* Time — always show if block tall enough */
        .c-time {
            color: var(--course-time);
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
        }

        /* Details (prof + room) — hidden when block < 70px */
        .c-details {
            display: flex;
            flex-direction: column;
            gap: 1px;
            overflow: hidden;
            flex-shrink: 1;
            min-height: 0;
        }
        .c-prof, .c-room {
            color: var(--course-meta);
            font-size: 10.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* When block height is very small, collapse details */
        .course-block.compact .c-details { display: none; }
        .course-block.compact .c-time { display: none; }
        .course-block.very-compact .c-title { font-size: 10px; }

        /* ─── TOOLTIP ─────────────────────────────── */
        .tooltip {
            position: fixed;
            background: var(--secondary);
            color: white;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            transition: opacity .15s;
            max-width: 220px;
            box-shadow: 0 8px 24px rgba(0,0,0,.25);
            line-height: 1.6;
        }
        .tooltip.visible { opacity: 1; }
        .tooltip-title { font-weight: 700; margin-bottom: 4px; }

        /* ─── FOOTER ──────────────────────────────── */
        footer { position: fixed; bottom: 0; left: 0; right: 0; height: var(--footer-h); background: var(--surface); border-top: 2px solid var(--border-strong); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 13px; color: var(--text-muted); z-index: 100; }
    </style>
<script src="notifications.js"></script>
</head>
<body>

<header>
    <div class="header-left">
        <button class="menu-btn" id="menuToggle">☰</button>
        <a href="#" class="logo" id="homeLogoLink">
            <div class="logo-icon" id="logoIcon">🎓</div>
            <span class="logo-name">SmartCampus</span>
        </a>
        <span class="logo-badge" id="roleBadge">Espace</span>
    </div>
    <div class="header-right">
        <button class="notif-btn">🔔<span class="notif-dot"></span></button>
        <div class="user-chip">
            <div class="user-avatar" id="userInitials">U</div>
            <span id="userNameDisplay">Utilisateur</span>
        </div>
    </div>
</header>

<div class="layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">Navigation</div>
        <div id="sidebarLinks"></div>
        <div class="sidebar-divider"></div>
        <a href="#" id="logoutBtn" class="danger">
            <span class="nav-icon">🚪</span> Déconnexion
        </a>
    </aside>

    <main class="content">
        <div class="cal-header">
            <button onclick="changeWeek(-1)">◀ Sem. précédente</button>
            <h3 id="weekLabel">Semaine du -- au --</h3>
            <button onclick="changeWeek(1)">Sem. suivante ▶</button>
        </div>
        <div class="calendar-wrapper">
            <div class="time-column" id="timeColumn"></div>
            <div class="days-container" id="daysContainer"></div>
        </div>
    </main>
</div>

<footer>
    <div>📧 support@smartcampus.edu</div>
    <div>📞 +33 06 12 34 56 78</div>
</footer>

<!-- Tooltip -->
<div class="tooltip" id="tooltip">
    <div class="tooltip-title" id="tt-title"></div>
    <div id="tt-time"></div>
    <div id="tt-prof"></div>
    <div id="tt-room"></div>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('smartcampus_user'));
    if (!user) window.location.href = "http://localhost:8888/Smart_Campus/Code/Connexion/index.html";

    const isTeacher = user.role === 'enseignant';

    // Apply teacher mode to body for CSS variables
    if (isTeacher) document.body.classList.add('teacher-mode');

    document.getElementById('userNameDisplay').textContent = user.prenom + ' ' + user.nom + (isTeacher ? ' (Prof)' : '');
    document.getElementById('userInitials').textContent = (user.prenom[0] + user.nom[0]).toUpperCase();
SmartNotifs.init(user);

    const logoIcon = document.getElementById('logoIcon');
    const roleBadge = document.getElementById('roleBadge');
    const homeLogoLink = document.getElementById('homeLogoLink');
    const userAvatar = document.getElementById('userInitials');

    if (isTeacher) {
        logoIcon.style.background = 'linear-gradient(135deg, #6366f1, #8b5cf6)';
        userAvatar.style.background = 'linear-gradient(135deg, #8b5cf6, #6366f1)';
        roleBadge.textContent = 'Espace Enseignant';
        homeLogoLink.href = 'teacher_dashboard.html';
        document.getElementById('sidebarLinks').innerHTML = `
            <a href="teacher_dashboard.html"><span class="nav-icon">🏠</span> Accueil</a>
            <a href="teacher_courses.html"><span class="nav-icon">📚</span> Mes Cours</a>
            <a href="teacher_grades.html"><span class="nav-icon">📝</span> Saisie des Notes</a>
            <a href="timetable.html" class="active teacher-active"><span class="nav-icon">📅</span> Emploi du temps</a>
            <a href="messages.html"><span class="nav-icon">✉️</span> Messagerie</a>
        `;
    } else {
        logoIcon.style.background = 'linear-gradient(135deg, #3b82f6, #10b981)';
        userAvatar.style.background = 'linear-gradient(135deg, #10b981, #3b82f6)';
        roleBadge.textContent = 'Espace Étudiant';
        homeLogoLink.href = 'dashboard.html';
        document.getElementById('sidebarLinks').innerHTML = `
            <a href="dashboard.html"><span class="nav-icon">🏠</span> Accueil</a>
            <a href="student_courses.html"><span class="nav-icon">📚</span> Mes Cours</a>
            <a href="student_grades.html"><span class="nav-icon">📊</span> Mes Notes</a>
            <a href="timetable.html" class="active student-active"><span class="nav-icon">📅</span> Emploi du temps</a>
            <a href="messages.html"><span class="nav-icon">✉️</span> Messagerie</a>
        `;
    }

    document.getElementById('menuToggle').addEventListener('click', () =>
        document.getElementById('sidebar').classList.toggle('collapsed'));
    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = "http://localhost:8888/Smart_Campus/Code/Connexion/index.html";
    });

    const startHour = 8, endHour = 20;
    const daysFr = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"];
    const daysMap = { "Lundi":"col-Lundi", "Mardi":"col-Mardi", "Mercredi":"col-Mercredi", "Jeudi":"col-Jeudi", "Vendredi":"col-Vendredi", "Samedi":"col-Samedi" };
    let currentDate = new Date();

    function getTodayDayName() {
        const dayNames = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
        return dayNames[currentDate.getDay()];
    }

    function buildCalendarGrid() {
        const timeCol = document.getElementById('timeColumn');
        timeCol.innerHTML = '';
        for (let i = startHour; i <= endHour; i++) {
            timeCol.innerHTML += `<div class="time-label"><span>${i}h00</span></div>`;
        }
        const daysContainer = document.getElementById('daysContainer');
        daysContainer.innerHTML = '';
        const todayName = getTodayDayName();
        daysFr.forEach(day => {
            let gridLinesHtml = '';
            for (let i = startHour; i < endHour; i++) gridLinesHtml += `<div class="grid-line"></div>`;
            const isToday = (day === todayName);
            daysContainer.innerHTML += `
                <div class="day-column" id="${daysMap[day]}">
                    <div class="day-header${isToday ? ' today' : ''}">${day}</div>
                    <div class="grid-lines">${gridLinesHtml}</div>
                    <div class="courses-container" id="container-${day}"></div>
                </div>`;
        });
    }

    function getMonday(d) {
        let nd = new Date(d), day = nd.getDay(), diff = nd.getDate() - day + (day === 0 ? -6 : 1);
        return new Date(nd.setDate(diff));
    }

    function formatDateSafe(date) {
        let d = new Date(date), month = '' + (d.getMonth() + 1), day = '' + d.getDate(), year = d.getFullYear();
        if (month.length < 2) month = '0' + month;
        if (day.length < 2) day = '0' + day;
        return [year, month, day].join('-');
    }

    function changeWeek(offset) {
        currentDate.setDate(currentDate.getDate() + (offset * 7));
        loadTimetable();
    }

    // Tooltip logic
    const tooltip = document.getElementById('tooltip');
    document.addEventListener('mousemove', e => {
        if (tooltip.classList.contains('visible')) {
            const gap = 14;
            let left = e.clientX + gap;
            let top = e.clientY + gap;
            if (left + 230 > window.innerWidth) left = e.clientX - 230 - gap;
            if (top + 120 > window.innerHeight) top = e.clientY - 120 - gap;
            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
        }
    });

    function showTooltip(e, cours, hDeb, hFin) {
        document.getElementById('tt-title').textContent = cours.titre;
        document.getElementById('tt-time').textContent = `🕐 ${hDeb[0]}:${hDeb[1]} – ${hFin[0]}:${hFin[1]}`;
        document.getElementById('tt-prof').textContent = cours.prof_nom ? `👨‍🏫 ${cours.prof_nom}` : 'Prof non assigné';
        document.getElementById('tt-room').textContent = `📍 ${cours.salle}`;
        tooltip.classList.add('visible');
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function loadTimetable() {
        buildCalendarGrid();
        let monday = getMonday(currentDate);
        let saturday = new Date(monday);
        saturday.setDate(monday.getDate() + 5);
        document.getElementById('weekLabel').innerHTML = `
            Semaine du ${monday.toLocaleDateString('fr-FR')} au ${saturday.toLocaleDateString('fr-FR')}<br>
            <small id="apiStatus" style="font-size:13px; font-weight:normal; display:block; margin-top:4px;">Recherche en cours...</small>`;

        fetch(`http://localhost:8888/Smart_Campus/Code/Prof_et_eleve/php/get_timetable.php?id_user=${user.id_user}&role=${user.role}&week_start=${formatDateSafe(monday)}&week_end=${formatDateSafe(saturday)}`)
        .then(res => res.json())
        .then(data => {
            const statusText = document.getElementById('apiStatus');
            if (data.success) {
                if (data.data.length > 0) {
                    statusText.innerHTML = `✅ ${data.data.length} cours trouvés pour cette semaine !`;
                    statusText.style.color = "#27ae60";
                } else {
                    statusText.innerHTML = `❌ 0 cours affichés. <strong>Diagnostic Serveur :</strong> ${data.debug}`;
                    statusText.style.color = "#e74c3c";
                }
                data.data.forEach(cours => {
                    let parts = cours.date_cours.split('-');
                    let dateObj = new Date(parts[0], parts[1]-1, parts[2]);
                    let dayNames = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
                    let dayName = dayNames[dateObj.getDay()];
                    let container = document.getElementById(`container-${dayName}`);
                    if (container) {
                        let hDeb = cours.heure_debut.split(':'), hFin = cours.heure_fin.split(':');
                        let startMins = parseInt(hDeb[0], 10) * 60 + parseInt(hDeb[1], 10);
                        let endMins = parseInt(hFin[0], 10) * 60 + parseInt(hFin[1], 10);
                        let topPosition = startMins - startHour * 60;
                        let duration = endMins - startMins;

                        let block = document.createElement('div');
                        block.className = 'course-block';

                        // Adaptive display based on block height
                        if (duration < 35) block.classList.add('compact');
                        if (duration < 25) block.classList.add('very-compact');

                        block.style.top = `${topPosition}px`;
                        block.style.height = `${duration}px`;

                        const profName = cours.prof_nom ? `👨‍🏫 ${cours.prof_nom}` : 'Prof non assigné';

                        block.innerHTML = `
                            <div class="course-inner">
                                <div class="c-title">${cours.titre}</div>
                                <div class="c-time">${hDeb[0]}:${hDeb[1]} – ${hFin[0]}:${hFin[1]}</div>
                                <div class="c-details">
                                    <div class="c-prof">${profName}</div>
                                    <div class="c-room">📍 ${cours.salle}</div>
                                </div>
                            </div>`;

                        // Tooltip on hover for compact blocks
                        block.addEventListener('mouseenter', e => showTooltip(e, cours, hDeb, hFin));
                        block.addEventListener('mouseleave', hideTooltip);

                        container.appendChild(block);
                    }
                });
            } else {
                statusText.textContent = `Erreur Serveur : ${data.message}`;
            }
        }).catch(err => console.error(err));
    }

    loadTimetable();
</script>
</body>
</html>
